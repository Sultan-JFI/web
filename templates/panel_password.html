{% extends 'base.html' %}
{% block layout %}
<div class="auth-container">
  <div class="glass-card auth-card animate__animated animate__fadeInUp" style="max-width:480px">
    <h1>تغییر رمز عبور</h1>
    {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}
    <div class="flash-msg {{ cat }}">{{ m }}</div>
    {% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="current_password">رمز فعلی</label>
        <input type="password" id="current_password" name="current_password" required>
      </div>
      <div class="form-group">
        <label for="new_password">رمز جدید (حداقل ۸ کاراکتر)</label>
        <input type="password" id="new_password" name="new_password" minlength="8" required>
      </div>
      <div class="form-group">
        <label for="confirm_password">تکرار رمز جدید</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
      </div>
      <button class="btn-primary" type="submit" style="width:100%">تغییر رمز</button>
    </form>
    <p style="text-align:center;margin-top:16px"><a href="{{ url_for('panel_dashboard') }}">بازگشت به داشبورد</a></p>
  </div>
</div>
{% endblock %}
